# `verify_jwt = false` bleibt ABSICHTLICH stehen — und bedeutet genau, was es
# sagt: der Endpunkt ist oeffentlich erreichbar. Auf dieser Installation wird
# der Wert ohnehin nicht ausgewertet (der Edge-Container laeuft mit global
# abgeschalteter Pruefung, und Kong reicht /functions/v1/* ohne Auth-Plugin
# durch). Ein `true` waere deshalb kein Schutz, sondern eine Zeile, die im Repo
# wie einer aussieht.
#
# Die Zugangskontrolle steht in der Funktion selbst: Bearer-JWT → echter
# Benutzer → Mitgliedschaft in der Firma des Termins, geprueft VOR jedem
# Geheimnis und vor jedem Versand (_shared/appointmentConfirmationGuard.ts).
# Ohne diesen Guard waere der Endpunkt eine anmeldungsfreie Ausloesung
# kostenpflichtiger Mails im Namen fremder Firmen.
[functions.send-appointment-confirmation]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-appointment-confirmation/index.ts"

# Resend Inbound-Webhook. verify_jwt = false, weil Resend keinen Supabase-JWT
# mitschickt — die Zugangskontrolle ist die Svix-Signatur in der Funktion selbst
# (RESEND_WEBHOOK_SECRET). Ohne gesetztes Secret wird jede Anfrage abgewiesen.
[functions.inbound-email-lead]
enabled = true
verify_jwt = false
entrypoint = "./functions/inbound-email-lead/index.ts"

# Aufräum-Funktion: löscht mit Service-Role über ALLE Firmen hinweg. Sie prüft
# ihren Aufrufer selbst (_shared/cronAuth.ts, Bearer = Service-Role-Key), denn
# Kong stellt /functions/v1/* ohne Auth-Plugin bereit.
[functions.auto-archive]
enabled = true
verify_jwt = false
entrypoint = "./functions/auto-archive/index.ts"

# Liest und schreibt Zugangsdaten Dritter, ohne sie je auszuliefern. Prueft
# JWT + Rolle (owner|admin) selbst.
[functions.company-secrets]
enabled = true
verify_jwt = false
entrypoint = "./functions/company-secrets/index.ts"

# webcal/ICS-Kalender-Abo. verify_jwt = false, weil Kalender-Clients (Apple/
# Google/Outlook) keine Header schicken koennen — die Zugangskontrolle ist das
# 64-Hex-Token in der URL, verglichen als SHA-256-Hash gegen
# calendar_feed_tokens. Unbekannt/widerrufen → nacktes 404.
[functions.calendar-feed]
enabled = true
verify_jwt = false
entrypoint = "./functions/calendar-feed/index.ts"
